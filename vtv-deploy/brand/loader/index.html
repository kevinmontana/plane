<!doctype html>
<html
  lang="es"
  data-composition-variables='[{"id":"variant","type":"enum","label":"Fondo","default":"light","options":[{"value":"light","label":"Claro"},{"value":"dark","label":"Oscuro"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=480" />
    <title>Loader VTV Gestión</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /*
       * Loader de Gestión (VTV): ciclo de 2.3 s en bucle, fondo transparente.
       * Variante "light" para fondos claros y "dark" para fondos oscuros; solo cambian la silueta y el azul.
       */
      #root {
        --ld-ghost: #e3e3e6;
        --ld-yellow-a: #f8bb04;
        --ld-yellow-b: #f39717;
        --ld-blue: #262f66;
        --ld-red-a: #a31915;
        --ld-red-b: #d40e13;
        position: relative;
        width: 100%;
        height: 100%;
      }
      #root[data-variant="dark"] {
        --ld-ghost: #2c2c30;
        --ld-blue: #2d3878;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 720px;
        height: 480px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.3"
      data-width="720"
      data-height="480"
    >
      <div
        id="loader"
        data-composition-id="loader"
        data-composition-src="compositions/loader.html"
        data-start="0"
        data-duration="2.3"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="720"
        data-height="480"
      ></div>
    </div>
    <script>
      const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
      document.getElementById("root").dataset.variant = vars.variant === "dark" ? "dark" : "light";
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
